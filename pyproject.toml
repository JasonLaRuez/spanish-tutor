[project]
name = "spanish-tutor"
version = "0.1.0"
description = "Word-bank-constrained Spanish tutor with a comprehensible-input recommender"
readme = "README.md"
authors = [
    { name = "JasonLaRuez", email = "jasonlaruez@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "es-core-news-md",
    "langchain>=1.4.3",
    "langchain-anthropic>=1.7.5",
    "langchain-chroma>=1.1.0",
    "langchain-huggingface>=1.2.2",
    "openpyxl>=3.1.5",
    "python-dotenv>=1.2.3",
    "spacy>=3.8,<3.9",
    "torch>=2.14.1",
    # Pinned below 5 / 6: the jina-embeddings-v2-base-es model code imports
    # transformers.onnx, which transformers 5 removed. See src/spanish_tutor/embeddings.py.
    "sentence-transformers>=5.7,<6",
    "transformers>=4.57,<5",
]

[tool.pytest.ini_options]
# Slow tests load the real embedding model; run them with `uv run pytest -m slow`.
markers = ["slow: loads large models; excluded by default"]
addopts = "-m 'not slow'"

[project.scripts]
spanish-tutor = "spanish_tutor:main"

[build-system]
requires = ["uv_build>=0.12.8,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[tool.uv.sources]
es-core-news-md = { url = "https://github.com/explosion/spacy-models/releases/download/es_core_news_md-3.8.0/es_core_news_md-3.8.0-py3-none-any.whl" }

[tool.ruff]
line-length = 100
