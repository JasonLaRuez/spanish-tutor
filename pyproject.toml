[project]
name = "spanish-tutor"
version = "0.1.0"
description = "Word-bank-constrained Spanish tutor with a comprehensible-input recommender"
readme = "README.md"
authors = [
    { name = "JasonLaRuez", email = "jasonlaruez@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "es-dep-news-trf",
    "langchain>=1.4.3",
    "langchain-anthropic>=1.7.5",
    "langchain-chroma>=1.1.0",
    "langchain-huggingface>=1.2.2",
    "openpyxl>=3.1.5",
    "python-dotenv>=1.2.3",
    "spacy>=3.8,<3.9",
    "spacy-transformers>=1.4,<1.5",
    "torch>=2.14.1",
    # Pinned below 5 / 6: the jina-embeddings-v2-base-es model code imports
    # transformers.onnx, which transformers 5 removed. See src/spanish_tutor/embeddings.py.
    # spacy-transformers 1.4 (the es_dep_news_trf tagger) further caps transformers below
    # 4.53.3. Jina's vectors were re-checked on 4.53.2 (2026-10-02): identical to the
    # stored ones, and the slow tests pass.
    "sentence-transformers>=5.7,<6",
    "transformers>=4.53,<5",
    "fastapi>=0.142.2",
    "uvicorn[standard]>=0.54.0",
    "piper-tts>=1.8,<2",
]

[tool.pytest.ini_options]
# Slow tests load the real embedding model; run them with `uv run pytest -m slow`.
# Live tests call the Claude API (about 1 cent); run them with `uv run pytest -m live`.
markers = [
    "slow: loads large models; excluded by default",
    "live: calls the Claude API; excluded by default",
]
addopts = "-m 'not slow and not live'"

[project.scripts]
spanish-tutor = "spanish_tutor:main"

[build-system]
requires = ["uv_build>=0.12.8,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "ipykernel>=7.4.0",
    "matplotlib>=3.11.2",
    "nbconvert>=7.17.1",
    "nbstripout>=0.9.1",
    "pandas>=3.0.6",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
    "scikit-learn>=1.9.1",
]

[tool.uv.sources]
es-dep-news-trf = { url = "https://github.com/explosion/spacy-models/releases/download/es_dep_news_trf-3.8.0/es_dep_news_trf-3.8.0-py3-none-any.whl" }

[tool.ruff]
line-length = 100
